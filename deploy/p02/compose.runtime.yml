# 02 组专用部署配置
services:
  runtime-worker:
    container_name: p02-runtime-worker
    image: p02-backend:${RELEASE_TAG:?run p02.py init}
    profiles:
    - runtime
    command:
    - celery
    - -A
    - education_experiment_platform
    - worker
    - --loglevel=INFO
    - --concurrency=1
    - --queues=q_provision,q_archive,q_compensate
    environment:
      APP_ENV: p02-lab
      APP_VERSION: ${APP_VERSION:-0.15.0-p15}
      OPENAPI_REVISION: ${OPENAPI_REVISION:-v2-p15}
      SIMILARITY_ALGORITHM_VERSION: ${SIMILARITY_ALGORITHM_VERSION:-char-5gram-jaccard-v1}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.30}
      SIMILARITY_RETENTION_DAYS: ${SIMILARITY_RETENTION_DAYS:-180}
      AUTO_CHECK_MAX_ATTEMPTS: ${AUTO_CHECK_MAX_ATTEMPTS:-${P10_AUTO_CHECK_MAX_ATTEMPTS:-3}}
      RUBRIC_AI_MODEL_NAME: ''
      RUBRIC_AI_BASE_URL: ''
      RUBRIC_AI_API_KEY: ''
      RUBRIC_AI_TIMEOUT_SECONDS: ${RUBRIC_AI_TIMEOUT_SECONDS:-60}
      CHAPTER_AI_MODEL_NAME: ${CHAPTER_AI_MODEL_NAME:-}
      CHAPTER_AI_BASE_URL: ${CHAPTER_AI_BASE_URL:-}
      CHAPTER_AI_API_KEY: ${CHAPTER_AI_API_KEY:-}
      ARCHIVE_RETENTION_DAYS: ${ARCHIVE_RETENTION_DAYS:-365}
      ARCHIVE_SAFE_RECYCLE_SECONDS: ${ARCHIVE_SAFE_RECYCLE_SECONDS:-900}
      ARCHIVE_EXPORT_TTL_SECONDS: ${ARCHIVE_EXPORT_TTL_SECONDS:-300}
      ARCHIVE_MAX_ATTEMPTS: ${ARCHIVE_MAX_ATTEMPTS:-5}
      RUNTIME_EXECUTION_RETENTION_DAYS: ${RUNTIME_EXECUTION_RETENTION_DAYS:-30}
      RUNTIME_CLEANUP_MAX_ATTEMPTS: ${RUNTIME_CLEANUP_MAX_ATTEMPTS:-10}
      GIT_REVISION: ${GIT_REVISION:-development}
      BUILD_TIME: ${BUILD_TIME:-development}
      DJANGO_SETTINGS_MODULE: education_experiment_platform.settings.p02_lab
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?run p02.py init}
      IDENTITY_HMAC_KEY: ${IDENTITY_HMAC_KEY:?run p02.py init}
      COURSE_INVITATION_HMAC_KEY: ${COURSE_INVITATION_HMAC_KEY:?run p02.py init}
      DJANGO_ALLOWED_HOSTS: django,localhost,127.0.0.1,student.localhost,teacher.localhost,admin.localhost,student.p02.test,teacher.p02.test,admin.p02.test
      DJANGO_TRUSTED_ORIGINS: http://student.p02.test:1025,http://teacher.p02.test:1025,http://admin.p02.test:1025
      EMAIL_BACKEND: django.core.mail.backends.dummy.EmailBackend
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@example.edu}
      STUDENT_PUBLIC_URL: http://student.p02.test:1025
      TEACHER_PUBLIC_URL: http://teacher.p02.test:1025
      TRUSTED_PROXY_CIDRS: ${P02_PROXY_CIDRS:-127.0.0.1/32}
      MYSQL_DATABASE: p02_platform
      MYSQL_USER: p02_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?run p02.py init}
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MONGODB_URI: mongodb://p02_logger:${MONGO_INITDB_ROOT_PASSWORD:?run p02.py init}@mongodb:27017/observability?authSource=admin&replicaSet=rs0
      MONGODB_LOG_DATABASE: observability
      MONGODB_LOG_COLLECTION: runtime_logs
      MONGODB_LOG_TTL_DAYS: ${MONGODB_LOG_TTL_DAYS:-30}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_INTERNAL_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://files.p02.test:1025
      MINIO_BUCKET: p02-platform
      MINIO_APP_ACCESS_KEY: p02-app
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?run p02.py init}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      LOG_LEVEL: INFO
      RUNTIME_MODE: local
      RUNTIME_ADAPTER_CODE: runtime/p02-docker
      LOCAL_RUNTIME_IMAGE: p02-stdio:${RELEASE_TAG:?run p02.py init}
      LOCAL_RUNTIME_NETWORK: p02_p02
      LOCAL_DOCKER_HOST: unix:///var/run/docker.sock
      LOCAL_RUNTIME_MODE: REAL
      RUNTIME_ADAPTER_CONFIGS: '{"runtime/p02-docker":{"base_url":"unix:///var/run/docker.sock","pids_limit":128}}'
      AUDIT_IP_HASH_SALT: ${AUDIT_IP_HASH_SALT:?run p02.py init}
      RUNTIME_RESOURCE_PREFIX: p02
      RUNTIME_IMAGE_OPERATIONS_ENABLED: 'false'
      RUNTIME_CAPACITY_CPU_MILLICORES: ${P02_RUNTIME_CPU_MILLICORES:-0}
      RUNTIME_CAPACITY_MEMORY_MB: ${P02_RUNTIME_MEMORY_MB:-0}
      P02_RUNTIME_APPROVED: ${P02_RUNTIME_APPROVED:-false}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    group_add:
    - ${DOCKER_SOCKET_GID:?administrator must provide Docker socket GID}
    networks:
    - p02
    depends_on:
      mysql-grants:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    cpus: '1.0'
    mem_limit: 768m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
