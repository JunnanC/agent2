worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout combined;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $host $portal_host {
    default "";
    student.p02.test student.localhost;
    teacher.p02.test teacher.localhost;
    admin.p02.test admin.localhost;
  }

  upstream gateway { server kong:8000; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  proxy_set_header Host $portal_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Portal "";
  proxy_set_header X-Auth-Context "";
  proxy_set_header X-Client-Id "";
  proxy_set_header X-Scopes "";
  proxy_set_header X-Proxy-Context "";

  server {
    listen 8080;
    server_name student.p02.test;
    root /srv/student-web;
    client_max_body_size 20m;

    location = /api/v2/events/stream {
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      add_header X-Accel-Buffering no always;
    }
    location /api/v2/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 60s; }
    location /workspace/ { return 404; }
    location /files/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 5m; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
  }

  server {
    listen 8080;
    server_name teacher.p02.test;
    root /srv/teacher-web;
    client_max_body_size 20m;
    location = /api/v2/events/stream { return 403; }
    location /api/v2/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 60s; }
    location /workspace/ { return 404; }
    location /files/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 5m; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
  }

  server {
    listen 8080;
    server_name admin.p02.test;
    root /srv/admin-web;
    client_max_body_size 10m;
    location = /api/v2/events/stream { return 403; }
    location /api/v2/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 45s; }
    location /workspace/ { return 404; }
    location /files/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_read_timeout 5m; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
  }

  server {
    listen 8080;
    server_name files.p02.test;
    client_max_body_size 25m;
    location / {
      proxy_pass http://minio:9000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 5m;
    }
  }

  server { listen 8080 default_server; server_name _; location = /healthz { access_log off; return 200 "p02\n"; } location / { return 421; } }
}
