name: ACR Continuous Deployment

on:
  workflow_run:
    workflows: [Experimental Platform CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Check server configuration without changing running services
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: agent2-production
  cancel-in-progress: false

jobs:
  build:
    if: >-
      vars.CD_ENABLED == 'true' && github.repository == 'JunnanC/agent2' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: web
            context: .
            dockerfile: infrastructure/nginx/Dockerfile
          - image: workspace
            context: runtime/algorithm-workspace
            dockerfile: runtime/algorithm-workspace/Dockerfile
          - image: reference
            context: runtime/reference-workspace
            dockerfile: runtime/reference-workspace/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require successful CI for this revision
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.revision.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success&per_page=1" --jq '.total_count > 0' | grep -qx true
      - name: Validate ACR configuration
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
        run: |
          test -n "$ACR_REGISTRY" && test -n "$ACR_NAMESPACE"
          [[ "$ACR_REGISTRY" != *://* && "$ACR_REGISTRY" != */* ]]
          [[ "$ACR_NAMESPACE" =~ ^[a-z0-9_-]+$ ]]
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # ACR Personal rejects OCI artifact attestation manifests (oci.empty.v1+json).
          provenance: false
          sbom: false
          tags: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/agent2-${{ matrix.image }}:${{ steps.revision.outputs.sha }}
          build-args: |
            GIT_REVISION=${{ steps.revision.outputs.sha }}
          cache-from: type=gha,scope=agent2-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=agent2-${{ matrix.image }}

  deploy:
    needs: build
    if: >-
      vars.DEPLOY_ENABLED == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.preflight_only)
    environment: production
    runs-on: [self-hosted, Linux, X64, agent2-production]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - name: Check configuration or deploy verified revision
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          RELEASE_SHA: ${{ needs.build.outputs.revision }}
          DEPLOY_PREFLIGHT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight_only && 'true' || 'false' }}
        run: bash scripts/cd/deploy.sh
