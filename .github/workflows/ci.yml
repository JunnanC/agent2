name: Experimental Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.14"

jobs:
  lock-check:
    name: 依赖锁校验
    runs-on: ubuntu-latest
    container: python:3.14-slim
    steps:
      - uses: actions/checkout@v4
      - name: 安装 uv
        run: pip install --no-cache-dir uv
      - name: 校验 uv.lock 与 pyproject.toml 一致性
        working-directory: backend
        run: |
          if [ ! -f uv.lock ]; then
            echo "ERROR: uv.lock 不存在，请先运行 uv lock"
            exit 1
          fi
          uv lock --check
          echo "OK: uv.lock 与 pyproject.toml 一致"

  lint:
    name: 代码规范检查
    runs-on: ubuntu-latest
    container: python:3.14-slim
    steps:
      - uses: actions/checkout@v4
      - name: 安装 ruff
        run: pip install --no-cache-dir ruff==0.13.1
      - name: Ruff check
        working-directory: backend
        run: ruff check .
      - name: 部署预检回归测试
        run: python -m unittest discover -s scripts/cd -p 'test_*.py'

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim
      options: --init
    services:
      redis:
        image: redis:7
    steps:
      - uses: actions/checkout@v4
      - name: 安装系统依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends default-libmysqlclient-dev build-essential pkg-config
          rm -rf /var/lib/apt/lists/*
      - name: 安装 uv
        run: pip install --no-cache-dir uv
      - name: 安装项目依赖
        working-directory: backend
        run: uv pip install --system ".[dev]"
      - name: 运行测试
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: education_experiment_platform.settings.test
          REDIS_CACHE_URL: redis://redis:6379/0
          CELERY_BROKER_URL: redis://redis:6379/1
        run: python -m pytest --tb=short -q

  docker-build:
    name: 构建镜像
    needs: [lock-check, lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: web
            context: .
            dockerfile: infrastructure/nginx/Dockerfile
          - image: workspace
            context: runtime/algorithm-workspace
            dockerfile: runtime/algorithm-workspace/Dockerfile
          - image: reference
            context: runtime/reference-workspace
            dockerfile: runtime/reference-workspace/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: 构建项目镜像
        run: |
          docker build \
            -f "${{ matrix.dockerfile }}" \
            -t "experimental-platform-${{ matrix.image }}:${GITHUB_SHA}" \
            "${{ matrix.context }}"
