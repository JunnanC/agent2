function renderList(){let data,headers,row;if(current==='courses'){data=courses.filter(c=>matching({...c,teacher:teacher(c.teacher).name})&&(!filter||c.status===filter));headers=['课程 / ID','任课教师','学生人数','实验数量','课程状态','创建时间','操作'];row=c=>`<tr><td><strong>${esc(c.name)}</strong><span class="mono muted">${c.id}</span></td><td>${teacher(c.teacher).name}</td><td class="num">${c.members.length}</td><td class="num">3</td><td>${status(c.status)}</td><td class="mono muted">${c.date}</td><td class="actions">${btn('详情',`courseDetail('${c.id}')`)}${c.status!=='已下架'?btn('下架',`confirmCourse('${c.id}')`,'link danger'):''}</td></tr>`}else if(['students','teachers'].includes(current)){let isStudent=current==='students';data=(isStudent?students:teachers).filter(x=>matching(x)&&(!filter||x.status===filter));headers=[isStudent?'学生 / ID':'教师 / ID','邮箱',isStudent?'加入课程数量':'创建课程数量','账号状态','注册时间','操作'];row=x=>`<tr><td><strong>${x.name}</strong><span class="mono muted">${x.id}</span></td><td class="muted">${x.email}</td><td class="num">${isStudent?joined(students.indexOf(x)).length:courses.filter(c=>c.teacher===x.id).length}</td><td>${status(x.status)}</td><td class="mono muted">${x.date}</td><td class="actions">${btn('详情',`personDetail('${current}','${x.id}')`)}${btn(x.status==='正常'?'禁用':'恢复',`confirmAccount('${current}','${x.id}')`,x.status==='正常'?'link danger':'link')}</td></tr>`}else if(current==='images'){data=images.filter(x=>matching(x)&&(!filter||x.status===filter));headers=['镜像名称 / ID','镜像地址及版本','用途说明','状态','操作'];row=x=>`<tr><td><strong>${esc(x.name)}</strong><span class="mono muted">${x.id}</span></td><td><div class="mono break">${esc(x.address)}</div><span class="mono muted">${esc(x.version)}</span></td><td class="break muted">${esc(x.description)}</td><td>${status(x.status)}</td><td class="actions">${btn('详情',`imageDetail('${x.id}')`)}${btn('编辑',`imageForm('${x.id}')`)}${btn(x.status==='启用'?'停用':'启用',`confirmImage('${x.id}')`)}</td></tr>`}else{data=logs.filter(x=>matching(x)&&(!filter||x.type===filter)&&(!logFrom||x.time.slice(0,10)>=logFrom)&&(!logTo||x.time.slice(0,10)<=logTo));headers=['操作时间','操作者','操作类型','操作对象','结果','操作'];row=x=>`<tr><td class="mono muted">${x.time}</td><td>运维管理员</td><td>${x.type}</td><td class="break">${esc(x.object)}</td><td>${status('成功')}</td><td>${btn('详情',`logDetail(${logs.indexOf(x)})`)}</td></tr>`}window.filteredTotal=data.length;page=Math.min(page,Math.max(1,Math.ceil(data.length/size)));$('#count').textContent=data.length+' 条记录';$('#list').innerHTML=table(headers,data.slice((page-1)*size,page*size).map(row))+pager(data.length);const buttons=$('#list').querySelectorAll('.pagination button');buttons[0].disabled=page===1;buttons[1].disabled=page>=Math.ceil(data.length/size)}
function renderOverview(){const healthy=services.filter(s=>s.status==='正常').length;$('#main').innerHTML=heading('关注教学实验的运行情况与需要处理的问题',btn('查看服务状态',"go('resources')"))+`<div class="notice"><div><strong>后台任务积压，实验节点 02 磁盘使用率达到 82%</strong><div class="muted" style="margin-top:4px">1 项服务异常 · 1 项资源预警 · 1 项服务状态未知</div></div>${btn('查看详情',"go('resources')")}</div><section class="metrics">${[['学生账号',students.length,'正常 '+students.filter(s=>s.status==='正常').length+' 个'],['教师账号',teachers.length,'正常 '+teachers.filter(s=>s.status==='正常').length+' 个'],['平台课程',courses.length,'进行中 '+courses.filter(s=>s.status==='进行中').length+' 门'],['运行实例',instances.length,'分布于 '+nodes.length+' 个实验节点']].map(([l,n,m])=>`<div class="metric"><span class="muted">${l}</span><b>${n}</b><small>${m}</small></div>`).join('')}</section><div class="grid"><section class="panel"><div class="panel-head"><h2>实验节点 CPU 使用率</h2><span class="muted">今日 08:00—09:30 · 演示采样</span></div><svg class="chart" viewBox="0 0 640 220" role="img" aria-label="节点平均 CPU 使用率从百分之二十四上升至百分之五十五"><g stroke="#edf0ee"><path d="M40 20H620M40 70H620M40 120H620M40 170H620"/></g><g fill="#7c847f" font-size="11" font-family="Consolas"><text x="5" y="24">75%</text><text x="5" y="74">50%</text><text x="5" y="124">25%</text><text x="12" y="174">0%</text><text x="40" y="205">08:00</text><text x="220" y="205">08:30</text><text x="400" y="205">09:00</text><text x="585" y="205">09:30</text></g><path d="M40 122 100 126 160 114 220 116 280 98 340 106 400 80 460 84 520 62 620 61" stroke="#397a64" stroke-width="2.5" fill="none"/><circle cx="620" cy="61" r="4" fill="#397a64"/></svg><div class="legend"><span>两节点平均值 · 最新 55%</span><span>每 10 分钟采样</span></div></section><section class="panel"><div class="panel-head"><h2>服务健康</h2><span class="mono muted">${healthy} / ${services.length} 正常</span></div>${services.slice(0,4).map(s=>`<div class="service-item"><div>${s.name}<small>${s.type}</small></div>${status(s.status)}</div>`).join('')}${btn('查看全部服务 →',"go('resources')")}</section></div><div class="grid"><section class="panel"><div class="panel-head"><h2>近期管理操作</h2>${btn('全部日志 →',"go('logs')")}</div>${logs.slice(0,3).map(l=>`<div class="activity"><span class="mono muted">${l.time.slice(5,16)}</span><span>${l.type}<div class="muted" style="margin-top:4px">${esc(l.object)}</div></span><span class="muted">运维管理员</span></div>`).join('')}</section><section class="panel"><div class="panel-head"><h2>节点资源</h2><span class="muted">内存 / 磁盘</span></div>${nodes.map(n=>`<div class="resource-line"><div><span>${n.name}</span><span class="mono">${Math.round(n.memory/n.memTotal*100)}% / ${Math.round(n.disk/n.diskTotal*100)}%</span></div><div class="bar ${n.disk/n.diskTotal>.8?'warning':''}"><i style="width:${n.disk/n.diskTotal*100}%"></i></div><span class="muted">磁盘 ${n.disk} / ${n.diskTotal} GB</span></div>`).join('')}</section></div><div class="footer-note">数据时间：${updated}（北京时间） · 所有数据均为原型演示</div>`}
function renderResources(){ $('#main').innerHTML=heading('查看服务健康与实验资源占用，不提供运行控制操作',btn('刷新状态','refreshResources()'))+`<div class="tabs">${btn('服务状态',"resourceTab='services';renderResources()",resourceTab==='services'?'active':'')}${btn('资源占用',"resourceTab='nodes';renderResources()",resourceTab==='nodes'?'active':'')}</div><div id="resource-content"></div><div class="footer-note">最近刷新：${updated}（北京时间） · 原型使用模拟数据</div>`;if(resourceTab==='services'){$('#resource-content').innerHTML=`<div class="toolbar"><select aria-label="服务状态筛选" onchange="filter=this.value;renderServiceList()"><option value="">全部状态</option>${['正常','异常','未知'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select><span class="muted">${services.length} 个服务 · ${services.filter(s=>s.status==='正常').length} 个正常</span></div><div id="service-list"></div>`;renderServiceList()}else{$('#resource-content').innerHTML=`<div class="toolbar"><select aria-label="节点筛选" onchange="nodeFilter=this.value;renderNodeList()"><option value="">全部节点</option>${nodes.map(n=>`<option value="${n.id}">${n.name}</option>`).join('')}</select><span class="muted">资源数据为节点整体占用，实例列表仅展示教学实验实例</span></div><div id="node-list"></div>`;renderNodeList()}}
function renderServiceList(){let ss=services.filter(s=>!filter||s.status===filter);$('#service-list').innerHTML=table(['服务名称','类型','健康状态','响应耗时','最近检查','操作'],ss.map(s=>`<tr><td><strong>${s.name}</strong><span class="mono muted">${s.id}</span></td><td>${s.type}</td><td>${status(s.status)}</td><td class="mono">${s.latency}</td><td class="mono muted">${updated}</td><td>${btn('详情',`serviceDetail('${s.id}')`)}</td></tr>`))}
function renderNodeList(){let ns=nodes.filter(n=>!nodeFilter||n.id===nodeFilter);$('#node-list').innerHTML=`<div class="node-grid">${ns.map(n=>`<section class="panel"><div class="panel-head"><h2>${n.name}</h2><span class="mono muted">${n.id}</span></div>${[['CPU',n.cpu,'100',n.cpu+'%'],['内存',n.memory,n.memTotal,n.memory+' / '+n.memTotal+' GB'],['磁盘',n.disk,n.diskTotal,n.disk+' / '+n.diskTotal+' GB']].map(([l,v,t,d])=>`<div class="resource-line"><div><span>${l}</span><span class="mono">${d}</span></div><div class="bar ${v/t>.8?'warning':''}"><i style="width:${v/t*100}%"></i></div></div>`).join('')}${n.disk/n.diskTotal>.8?'<span class="status warn">磁盘占用超过 80%，建议运维排查</span>':'<span class="muted">资源占用处于正常范围</span>'}</section>`).join('')}</div><div class="panel-head"><h2>运行中的实验实例</h2><span class="muted">仅供查看</span></div>${table(['实例 / 节点','课程','学生','CPU（核）','内存（GB）','状态'],instances.filter(i=>!nodeFilter||i.node===nodeFilter).map(i=>`<tr><td><strong class="mono">${i.id}</strong><span class="mono muted">${i.node}</span></td><td>${btn(esc(course(i.course).name),`courseDetail('${i.course}')`)}<div class="mono muted">${i.course}</div></td><td>${students[i.student].name}</td><td class="num mono">${i.cpu.toFixed(1)}</td><td class="num mono">${i.memory.toFixed(1)}</td><td>${status('运行中')}</td></tr>`))}`}
function refreshResources(){updated=now();renderResources();notify('已刷新演示状态，数值保持模拟快照')}
function openModal(title,content,actions='',detail=false){const d=$('#modal');d.className=detail?'detail':'';d.innerHTML=`<div class="dialog-body"><div class="dialog-head"><h2>${esc(title)}</h2><button onclick="closeModal()" aria-label="关闭弹窗">×</button></div>${content}${actions?`<div class="dialog-actions">${actions}</div>`:''}</div>`;if(!d.open)d.showModal()}
function closeModal(){$('#modal').close()}
function fields(items){return `<dl class="detail-grid">${items.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`}
function courseDetail(id,tab='info'){const c=course(id);openModal(c.name,`<div class="muted mono" style="margin-bottom:20px">${c.id} · 一门课程 / 一个教学班</div>${c.status==='已下架'?`<div class="reason">下架原因：${esc(c.reason)}<div class="mono" style="margin-top:8px">${c.downAt}</div></div>`:''}<div class="tabs">${[['info','课程信息'],['members','学生名单'],['experiments','实验安排']].map(([k,v])=>btn(v,`courseDetail('${id}','${k}')`,tab===k?'active':'')).join('')}</div>${tab==='info'?fields([['课程 ID',`<span class="mono">${c.id}</span>`],['课程状态',status(c.status)],['任课教师',btn(teacher(c.teacher).name,`personDetail('teachers','${c.teacher}')`)],['学生人数',c.members.length+' 人'],['创建时间',c.date],['实验镜像',esc(images.find(i=>i.id===c.image).name)]])+`<p class="muted">本课程通过独立实验环境开展实践教学。课程内容、成员与实验时间由任课教师维护。</p>`:tab==='members'?table(['学生','学生 ID','加入时间','账号状态'],c.members.map(i=>`<tr><td>${btn(students[i].name,`personDetail('students','${students[i].id}')`)}</td><td class="mono">${students[i].id}</td><td class="mono muted">${students[i].date}</td><td>${status(students[i].status)}</td></tr>`)):table(['实验名称','开放时间','截止时间','已完成 / 学生人数'],['环境准备与基础操作','核心任务实践','综合实验'].map((n,i)=>`<tr><td>${n}</td><td class="mono">2026-11-${String(2+i*7+(courses.indexOf(c)%3)).padStart(2,'0')} 08:00</td><td class="mono">2026-11-${String(8+i*7+(courses.indexOf(c)%3)).padStart(2,'0')} 23:59</td><td class="num">${i===0?Math.max(0,c.members.length-2):0} / ${c.members.length}</td></tr>`))}`,btn('关闭','closeModal()'),true)}
function personDetail(kind,id){const x=(kind==='students'?students:teachers).find(x=>x.id===id),cs=kind==='students'?joined(students.indexOf(x)):courses.filter(c=>c.teacher===id);openModal(x.name,fields([['账号 ID',`<span class="mono">${x.id}</span>`],['账号状态',status(x.status)],['邮箱',esc(x.email)],['注册时间',x.date]])+(x.status==='已禁用'?`<div class="reason">禁用原因：${esc(x.reason)}</div>`:'')+`<h3>${kind==='students'?'已加入课程':'创建的课程'} · ${cs.length} 门</h3>`+table(['课程 / ID','任课教师','课程状态'],cs.map(c=>`<tr><td>${btn(esc(c.name),`courseDetail('${c.id}')`)}<div class="mono muted">${c.id}</div></td><td>${teacher(c.teacher).name}</td><td>${status(c.status)}</td></tr>`)),btn('关闭','closeModal()'),true)}
function confirmAccount(kind,id){const x=(kind==='students'?students:teachers).find(x=>x.id===id),disable=x.status==='正常';openModal((disable?'禁用':'恢复')+'账号',`<p>${esc(x.name)} <span class="mono muted">${x.id}</span></p><p class="muted">${disable?'禁用后账号将无法正常使用平台。课程与成员关联保留。':'恢复后账号可重新正常使用平台。'}</p>${disable?'<label class="form-row">禁用原因<textarea id="reason" placeholder="填写账号禁用原因" maxlength="300"></textarea></label>':''}<div class="form-error" id="error"></div>`,btn('取消','closeModal()')+btn(disable?'确认禁用':'确认恢复',`applyAccount('${kind}','${id}')`,'primary'))}
function applyAccount(kind,id){const x=(kind==='students'?students:teachers).find(x=>x.id===id),disable=x.status==='正常',reason=disable?$('#reason').value.trim():'恢复账号使用';if(disable&&!reason){$('#error').textContent='请填写禁用原因';return}x.status=disable?'已禁用':'正常';x.reason=disable?reason:'';addLog(disable?'账号禁用':'账号恢复',x.id+' · '+x.name,reason);closeModal();render();notify(disable?'账号已禁用':'账号已恢复')}
function confirmCourse(id){const c=course(id);openModal('下架违规课程',`<p>${esc(c.name)} <span class="mono muted">${c.id}</span></p><p class="muted">任课教师：${teacher(c.teacher).name} · ${c.members.length} 位学生<br>下架记录将保留，学生名单由教师管理</p><label class="form-row">下架原因<textarea id="reason" placeholder="填写违规情况与下架原因" maxlength="500"></textarea></label><div class="form-error" id="error"></div>`,btn('取消','closeModal()')+btn('确认下架',`applyCourse('${id}')`,'primary'))}
function applyCourse(id){let reason=$('#reason').value.trim();if(!reason){$('#error').textContent='请填写下架原因';return}let c=course(id);c.status='已下架';c.reason=reason;c.downAt=now();addLog('课程下架',c.id+' · '+c.name,reason);closeModal();render();notify('课程已下架，已记录原因')}
function imageDetail(id){const x=images.find(i=>i.id===id),cs=courses.filter(c=>c.image===id);openModal(x.name,fields([['镜像 ID',x.id],['状态',status(x.status)],['镜像地址',`<span class="mono">${esc(x.address)}</span>`],['版本',`<span class="mono">${esc(x.version)}</span>`],['用途说明',esc(x.description)],['关联课程',cs.length+' 门']])+`<h3>使用该镜像的课程</h3>`+table(['课程 / ID','任课教师'],cs.map(c=>`<tr><td>${btn(esc(c.name),`courseDetail('${c.id}')`)}<div class="mono muted">${c.id}</div></td><td>${teacher(c.teacher).name}</td></tr>`)),btn('关闭','closeModal()'),true)}
function imageForm(id=''){const x=images.find(i=>i.id===id)||{name:'',address:'',version:'',description:'',status:'启用'};openModal(id?'编辑镜像':'新增镜像',`<form id="image-form" onsubmit="event.preventDefault();saveImage('${id}')">${[['name','显示名称','例如：Linux 网络实验环境'],['address','镜像地址','例如：registry.example.edu/labs/linux'],['version','版本','例如：v2.4']].map(([k,l,p])=>`<label class="form-row">${l}<input name="${k}" value="${esc(x[k])}" placeholder="${p}" required maxlength="${k==='address'?240:80}"></label>`).join('')}<label class="form-row">用途说明<textarea name="description" required maxlength="300">${esc(x.description)}</textarea></label><label class="form-row">状态<select name="status"><option ${x.status==='启用'?'selected':''}>启用</option><option ${x.status==='停用'?'selected':''}>停用</option></select></label><div id="error" class="form-error"></div><div class="dialog-actions">${btn('取消','closeModal()')}<button class="primary" type="submit">保存镜像</button></div></form>`)}
function saveImage(id){const form=$('#image-form'),v=Object.fromEntries(new FormData(form));Object.keys(v).forEach(k=>v[k]=v[k].trim());if(!v.name||!v.address||!v.version||!v.description){$('#error').textContent='请填写完整配置';return}if(/\s/.test(v.address)||!v.address.includes('/')){$('#error').textContent='镜像地址需包含仓库路径，且不能包含空格';return}if(images.some(i=>i.id!==id&&i.address===v.address&&i.version===v.version)){$('#error').textContent='相同镜像地址和版本已存在';return}let x=images.find(i=>i.id===id),before=x?JSON.stringify(x,null,2):'';if(x)Object.assign(x,v);else{x={id:'IMG-'+String(images.length+1).padStart(3,'0'),...v};images.push(x)}addLog(id?'镜像编辑':'镜像新增',x.id+' · '+x.name,id?'更新镜像配置':'登记平台可用镜像',before,JSON.stringify(x,null,2));closeModal();render();notify('镜像配置已保存')}
function confirmImage(id){const x=images.find(i=>i.id===id),off=x.status==='启用';openModal(off?'停用镜像':'启用镜像',`<p>${esc(x.name)}</p><p class="mono break">${esc(x.address)}:${esc(x.version)}</p><p class="muted">${off?'停用后教师不能在新实验中选择此镜像，已有实验关联保留。':'启用后教师可以在实验中选择此镜像。'}</p>`,btn('取消','closeModal()')+btn(off?'确认停用':'确认启用',`applyImage('${id}')`,'primary'))}
function applyImage(id){const x=images.find(i=>i.id===id),off=x.status==='启用';x.status=off?'停用':'启用';addLog(off?'镜像停用':'镜像启用',x.id+' · '+x.name,off?'停止新选用，保留已有实验关联':'开放教师选用');closeModal();render();notify(off?'镜像已停用':'镜像已启用')}
function serviceDetail(id){const s=services.find(x=>x.id===id);openModal(s.name,fields([['服务类型',s.type],['健康状态',status(s.status)],['响应耗时',s.latency],['最近检查',updated]])+`<h3>检查说明</h3><p>${s.note}</p><p class="muted">此页面仅供查看，请通过现有运维流程排查和处理服务问题</p>`,btn('关闭','closeModal()'))}
function logDetail(i){const l=logs[i];openModal('操作详情',fields([['操作类型',l.type],['操作时间',l.time],['操作者','运维管理员'],['操作结果',status('成功')],['操作对象',esc(l.object)],['原因 / 说明',esc(l.reason)]])+(l.before?`<h3>变更前</h3><pre class="mono" style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f6f5;padding:16px;border-radius:8px">${esc(l.before)}</pre>`:'')+(l.after?`<h3>变更后</h3><pre class="mono" style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f6f5;padding:16px;border-radius:8px">${esc(l.after)}</pre>`:''),btn('关闭','closeModal()'),true)}
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(p!==current&&pageNames[p])go(p)});$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});console.assert(courses.every(c=>teachers.some(t=>t.id===c.teacher)),'课程必须对应一位教师');console.assert(new Set(courses.map(c=>c.id)).size===courses.length,'课程 ID 唯一');go(location.hash.slice(1)||'overview');
</script></body></html>
