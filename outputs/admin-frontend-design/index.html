<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f3">
  <title>平台管理 · Edu Agent Platform</title>
  <style>
    :root{color-scheme:light;--ink:#202b29;--muted:#6c7773;--line:#e2e7e3;--paper:#f5f6f3;--surface:#fff;--soft:#eff3ef;--green:#2f6658;--green-soft:#e5efea;--blue:#426b87;--blue-soft:#e8eff4;--amber:#94651d;--amber-soft:#faf0dc;--red:#a54c44;--red-soft:#f7e9e6;--violet:#6b6288;--violet-soft:#efedf5;--radius:5px;--shadow:0 1px 2px #22352b0a,0 8px 24px #22352b08;font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-size:14px}button,input,select{font:inherit}button{color:inherit}a{color:inherit;text-decoration:none}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:248px;padding:22px 16px 18px;background:#fbfcfa;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 24px}.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:white;font-weight:700;font-size:16px}.brand-copy{min-width:0}.brand-copy strong{display:block;font-size:14px;white-space:nowrap}.brand-copy small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.nav-label{padding:13px 10px 6px;color:#87918d;font-size:10px;font-weight:700;letter-spacing:0}.nav{display:grid;gap:3px}.nav button{width:100%;height:38px;border:0;border-radius:4px;background:transparent;display:flex;align-items:center;gap:10px;padding:0 10px;text-align:left;color:#59645f;cursor:pointer}.nav button:hover{background:#f1f4f1}.nav button.active{color:var(--green);background:var(--green-soft);font-weight:600}.nav-icon{width:17px;text-align:center;font-size:14px;line-height:1}.nav-count{margin-left:auto;color:var(--amber);font-variant-numeric:tabular-nums}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0}.environment{display:flex;align-items:center;gap:8px;padding:8px 4px;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#4a8b6b;box-shadow:0 0 0 3px #4a8b6b19}.operator{display:flex;align-items:center;gap:9px;margin-top:10px;padding:9px 4px}.avatar{width:30px;height:30px;border-radius:50%;background:#e8ece7;display:grid;place-items:center;color:#43564c;font-size:12px;font-weight:700}.operator-name{font-size:12px;font-weight:600}.operator-role{margin-top:3px;color:var(--muted);font-size:11px}.main{margin-left:248px;min-height:100vh}.topbar{height:58px;position:sticky;top:0;z-index:4;background:#f8f9f6f2;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;backdrop-filter:blur(10px)}.top-left{display:flex;align-items:center;gap:11px;color:var(--muted);font-size:12px}.top-left strong{color:var(--ink);font-weight:600}.crumb-sep{color:#aeb6b1}.top-actions{display:flex;align-items:center;gap:10px}.icon-button{height:32px;width:34px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:4px;cursor:pointer;color:#66716c}.icon-button:hover{background:white;border-color:var(--line)}.top-avatar{height:28px;width:28px;border-radius:50%;background:#e8ece7;display:grid;place-items:center;font-size:11px;font-weight:700}.content{max-width:1560px;margin:0 auto;padding:29px 34px 50px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:23px}.eyebrow{display:flex;align-items:center;gap:7px;color:var(--green);font-size:11px;font-weight:650}.page-head h1{font-size:25px;line-height:1.25;margin:7px 0 5px;font-weight:650}.page-head p{font-size:13px;color:var(--muted);margin:0}.head-actions{display:flex;align-items:center;gap:8px;padding-top:7px}.btn{height:34px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #d9dfdb;border-radius:4px;background:white;color:#3c4944;font-size:12px;font-weight:550;cursor:pointer;white-space:nowrap}.btn:hover{border-color:#aebdb5;background:#fbfcfb}.btn.primary{color:#fff;background:var(--green);border-color:var(--green)}.btn.primary:hover{background:#285a4d}.btn.quiet{border-color:transparent;background:transparent;color:#59665f}.btn:disabled{opacity:.5;cursor:not-allowed}.demo-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:3px;background:#f3eee2;color:#78643c;font-size:10px;font-weight:600}.demo-tag:before{content:"";width:5px;height:5px;border-radius:50%;background:#ba8a36}.section{margin-top:23px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 11px}.section-title h2{font-size:14px;font-weight:650;margin:0}.section-title small{font-size:11px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{min-height:106px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px;cursor:pointer;text-align:left;transition:border-color .18s ease,transform .18s ease}.metric:hover{border-color:#b8c7bf;transform:translateY(-1px)}.metric-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}.metric-glyph{color:#84938a;font-size:14px}.metric-value{font-size:26px;font-weight:650;line-height:1;margin-top:12px;font-variant-numeric:tabular-nums}.metric-foot{display:flex;align-items:center;gap:6px;margin-top:8px;color:var(--muted);font-size:10px}.delta{font-weight:650}.delta.good{color:var(--green)}.delta.warn{color:var(--amber)}.columns{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(330px,1fr);gap:15px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.panel-head{min-height:49px;padding:0 15px;border-bottom:1px solid #edf0ed;display:flex;align-items:center;justify-content:space-between;gap:10px}.panel-head h2{font-size:13px;font-weight:650;margin:0}.panel-head small{font-size:10px;color:var(--muted);margin-left:8px}.panel-body{padding:14px 15px}.trend{height:177px;display:flex;align-items:flex-end;gap:13px;padding:15px 5px 3px;border-bottom:1px solid var(--line);position:relative}.chart-grid{position:absolute;inset:16px 0 3px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.chart-grid span{border-top:1px dashed #e7ebe8;width:100%}.bar-group{height:100%;flex:1;display:flex;align-items:flex-end;justify-content:center;gap:4px;position:relative;z-index:1}.bar{width:min(13px,35%);height:var(--h);min-height:4px;border-radius:2px 2px 0 0;background:#65917c}.bar.secondary{background:#88a6b4}.bar-group em{position:absolute;bottom:-20px;font-style:normal;color:#87918c;font-size:10px}.legend{display:flex;gap:14px;color:var(--muted);font-size:10px}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{height:7px;width:7px;border-radius:1px;background:#65917c}.legend i.blue{background:#88a6b4}.queue{display:grid}.queue-row{min-height:56px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;border-bottom:1px solid #edf0ed;padding:8px 1px}.queue-row:last-child{border-bottom:0}.queue-title{font-size:12px;font-weight:580}.queue-meta{font-size:10px;color:var(--muted);margin-top:5px}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:3px;padding:4px 7px;font-size:10px;white-space:nowrap}.pill:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.pill.red{color:var(--red);background:var(--red-soft)}.pill.amber{color:var(--amber);background:var(--amber-soft)}.pill.green{color:var(--green);background:var(--green-soft)}.pill.blue{color:var(--blue);background:var(--blue-soft)}.pill.gray{color:#67726c;background:#eff1ef}.health-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.health{padding:11px 12px;background:#f8faf8;border-radius:4px}.health-top{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600}.health p{font-size:10px;color:var(--muted);margin:7px 0 0}.health-dot{width:6px;height:6px;border-radius:50%;background:#54866a}.health-dot.warn{background:#c48a2c}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid #edf0ed}.search{height:33px;width:min(270px,100%);padding:0 10px;border:1px solid #dfe5e1;border-radius:4px;background:#fff;outline:none;font-size:11px}.search:focus,.select:focus{border-color:#7da18e;box-shadow:0 0 0 2px #3c7b6118}.select{height:33px;padding:0 26px 0 9px;border:1px solid #dfe5e1;border-radius:4px;background:#fff;color:#4f5d56;font-size:11px}.toolbar-end{margin-left:auto;color:var(--muted);font-size:10px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{height:36px;padding:0 12px;background:#f8faf8;color:#7c8781;font-size:10px;font-weight:600;white-space:nowrap}td{height:48px;padding:7px 12px;border-top:1px solid #edf0ed;color:#46534d;font-size:11px;white-space:nowrap}tbody tr:hover{background:#fafcf9}.object-cell{font-weight:600;color:#2e3b35}.muted{color:var(--muted)}.mono{font-family:Consolas,"SFMono-Regular",monospace;font-size:10px;color:#68746e}.row-action{border:0;background:transparent;color:var(--green);font-size:11px;font-weight:600;cursor:pointer;padding:5px}.row-action:hover{text-decoration:underline}.split{display:grid;grid-template-columns:1fr 1fr;gap:13px}.progress-row{display:grid;grid-template-columns:115px minmax(50px,1fr) 35px;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf0ed;font-size:11px}.progress-row:last-child{border-bottom:0}.track{height:6px;border-radius:4px;background:#e9eeea;overflow:hidden}.track span{display:block;height:100%;width:var(--w);background:#56816b;border-radius:4px}.track.amber span{background:#ba8a36}.track.red span{background:#ae5a50}.resource-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf0ed}.resource-row:last-child{border-bottom:0}.tabs{height:40px;display:flex;align-items:stretch;gap:17px;border-bottom:1px solid var(--line);margin:0 0 14px}.tabs button{position:relative;border:0;background:transparent;padding:0 2px;color:var(--muted);font-size:11px;cursor:pointer}.tabs button.active{color:var(--green);font-weight:650}.tabs button.active:after{position:absolute;content:"";height:2px;background:var(--green);bottom:-1px;left:0;right:0}.drawer-backdrop{position:fixed;inset:0;background:#15221d55;z-index:10;display:none}.drawer-backdrop.open{display:block}.drawer{position:absolute;inset:0 0 0 auto;width:min(460px,100%);background:white;box-shadow:-10px 0 35px #15221d22;padding:23px 22px;overflow:auto;animation:drawer-in .22s cubic-bezier(.2,.75,.25,1)}@keyframes drawer-in{from{transform:translateX(18px);opacity:.75}to{transform:translateX(0);opacity:1}}.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:15px;border-bottom:1px solid var(--line)}.drawer-head h2{font-size:17px;margin:0 0 6px}.drawer-head p{font-size:11px;color:var(--muted);margin:0}.drawer-section{padding:16px 0;border-bottom:1px solid #edf0ed}.drawer-section h3{font-size:11px;margin:0 0 9px}.detail-line{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:7px 0;font-size:11px}.detail-line span{color:var(--muted)}.drawer-actions{display:flex;justify-content:flex-end;gap:7px;padding-top:16px}.toast{position:fixed;bottom:19px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;z-index:20;background:#263631;color:white;border-radius:4px;padding:10px 14px;font-size:11px;transition:opacity .18s ease,transform .18s ease}.toast.show{opacity:1;transform:translate(-50%,0)}.mobile-nav{display:none}
    @media(max-width:1120px){.sidebar{width:220px}.main{margin-left:220px}.content{padding:25px 23px 40px}.topbar{padding:0 23px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}.health-list{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:720px){.sidebar{display:none}.main{margin-left:0}.topbar{height:52px;padding:0 15px}.top-left .crumb-sep,.top-left .top-parent{display:none}.mobile-nav{display:grid}.content{padding:22px 15px 35px}.page-head{display:block}.page-head h1{font-size:22px}.head-actions{padding-top:14px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{padding:12px;min-height:98px}.metric-value{font-size:23px}.columns,.split{grid-template-columns:1fr}.health-list{grid-template-columns:1fr}.section{margin-top:18px}.toolbar{align-items:stretch}.search{flex:1;width:auto}.toolbar-end{width:100%;margin-left:0}.hide-mobile{display:none}td,th{padding-left:9px;padding-right:9px}.page-head p{max-width:38em;line-height:1.6}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="平台管理导航">
    <div class="brand"><span class="brand-mark">E</span><span class="brand-copy"><strong>Edu Agent Platform</strong><small>平台管理控制台</small></span></div>
    <div class="nav-label">总览</div>
    <nav class="nav">
      <button class="active" data-page="overview"><span class="nav-icon">▦</span>平台概览</button>
    </nav>
    <div class="nav-label">治理</div>
    <nav class="nav">
      <button data-page="governance"><span class="nav-icon">⌑</span>治理待办<span class="nav-count">08</span></button>
      <button data-page="resources"><span class="nav-icon">▤</span>运行资源</button>
    </nav>
    <div class="nav-label">运行与审计</div>
    <nav class="nav">
      <button data-page="incidents"><span class="nav-icon">△</span>异常中心<span class="nav-count">03</span></button>
      <button data-page="audit"><span class="nav-icon">≡</span>操作审计</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="environment"><span class="dot"></span>平台服务状态正常</div>
      <div class="operator"><span class="avatar">管</span><span><span class="operator-name">平台管理员</span><span class="operator-role">平台运维与治理</span></span></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="top-left"><button class="icon-button mobile-nav" id="mobileMenu" aria-label="打开管理导航">☰</button><span class="top-parent">平台管理</span><span class="crumb-sep">/</span><strong id="crumb">平台概览</strong></div><div class="top-actions"><span class="demo-tag">演示数据</span><button class="icon-button" id="helpButton" aria-label="帮助">?</button><span class="top-avatar">管</span></div></header>
    <div class="content" id="content" aria-live="polite"></div>
  </main>
</div>
<div class="drawer-backdrop" id="drawerBackdrop" role="presentation"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><div class="drawer-head"><div><h2 id="drawerTitle">事项详情</h2><p id="drawerSubtitle">平台治理记录</p></div><button class="icon-button" id="closeDrawer" aria-label="关闭详情">×</button></div><div id="drawerBody"></div></aside></div>
<div class="toast" id="toast" role="status"></div>
<script>
  const pages={
    overview:{title:'平台概览',eyebrow:'平台运行',description:'汇总平台运行状态与待处理治理事项，快速定位需要处理的风险。',body:()=>`
      <div class="metrics">
        <button class="metric" data-go="resources"><span class="metric-label">活跃工作区 <span class="metric-glyph">▤</span></span><span class="metric-value">128</span><span class="metric-foot"><span class="delta good">124 正常</span> · 4 个需关注</span></button>
        <button class="metric" data-go="resources"><span class="metric-label">CPU 配额使用 <span class="metric-glyph">⌁</span></span><span class="metric-value">62%</span><span class="metric-foot">总量 32 vCPU · 近 24 小时</span></button>
        <button class="metric" data-go="resources"><span class="metric-label">内存配额使用 <span class="metric-glyph">▥</span></span><span class="metric-value">71%</span><span class="metric-foot">可用 42 GB · 近 24 小时</span></button>
        <button class="metric" data-go="governance"><span class="metric-label">待处理事项 <span class="metric-glyph">⌑</span></span><span class="metric-value">08</span><span class="metric-foot"><span class="delta warn">2 项高优先级</span> · 等待处理</span></button>
      </div>
      <div class="columns section">
        <section class="panel"><div class="panel-head"><div><h2>资源使用趋势 <small>近 24 小时</small></h2></div><div class="legend"><span><i></i>CPU</span><span><i class="blue"></i>内存</span></div></div><div class="panel-body"><div class="trend" aria-label="CPU 与内存使用趋势"><div class="chart-grid"><span></span><span></span><span></span><span></span></div>${[[30,44],[35,42],[41,47],[38,49],[48,53],[55,52],[51,57],[62,59],[58,63],[66,68],[62,71],[59,65]].map(([a,b],i)=>`<span class="bar-group" title="${String(i*2).padStart(2,'0')}:00"><i class="bar" style="--h:${a}%"></i><i class="bar secondary" style="--h:${b}%"></i><em>${i%3===0?String(i*2).padStart(2,'0'):''}</em></span>`).join('')}</div></div></section>
        <section class="panel"><div class="panel-head"><h2>待处理治理事项</h2><button class="row-action" data-go="governance">查看全部 →</button></div><div class="panel-body queue">
          ${queueItem('教师资格审核','12 位申请人 · 最早 2 天前','高','red','governance')}${queueItem('镜像扫描复核','3 个镜像等待复核','中','amber','resources')}${queueItem('运行时容量告警','集群 B · CPU 余量偏低','高','red','resources')}${queueItem('实验任务异常','2 项等待分派','低','blue','incidents')}
        </div></section>
      </div>
      <section class="section"><div class="section-title"><h2>平台服务健康</h2><small>最后更新 14:32 · 数据为界面演示</small></div><div class="health-list"><div class="health"><div class="health-top"><i class="health-dot"></i>API 服务</div><p>响应正常 · p95 142 ms</p></div><div class="health"><div class="health-top"><i class="health-dot"></i>数据存储</div><p>连接池运行正常</p></div><div class="health"><div class="health-top"><i class="health-dot warn"></i>运行时集群 B</div><p>容量偏低 · 建议检查配额</p></div></div></section>`,
    },
    governance:{title:'治理待办',eyebrow:'平台治理',description:'按风险和时效处理教师资格、资源治理与安全事项。',body:()=>`
      <div class="metrics"><div class="metric"><span class="metric-label">待处理事项</span><span class="metric-value">08</span><span class="metric-foot">4 类治理队列</span></div><div class="metric"><span class="metric-label">高优先级</span><span class="metric-value">02</span><span class="metric-foot"><span class="delta warn">需要尽快响应</span></span></div><div class="metric"><span class="metric-label">平均等待</span><span class="metric-value">6.4h</span><span class="metric-foot">按待处理事项计算</span></div><div class="metric"><span class="metric-label">今日已完成</span><span class="metric-value">14</span><span class="metric-foot"><span class="delta good">较昨日 +3</span></span></div></div>
      <section class="panel section"><div class="toolbar"><input class="search" data-filter="governanceTable" placeholder="搜索事项、对象或负责人" aria-label="搜索治理事项"><select class="select" data-select-filter="governanceTable"><option value="all">全部优先级</option><option value="高">高优先级</option><option value="中">中优先级</option><option value="低">低优先级</option></select><span class="toolbar-end">队列数据为演示内容</span></div><div class="table-wrap"><table id="governanceTable"><thead><tr><th>事项</th><th>治理范围</th><th>优先级</th><th>等待时间</th><th>负责人</th><th></th></tr></thead><tbody>${governanceRows.map(row=>`<tr data-search="${row.join(' ').toLowerCase()}" data-priority="${row[2]}"><td class="object-cell">${row[0]}</td><td>${row[1]}</td><td>${priorityPill(row[2])}</td><td>${row[3]}</td><td>${row[4]}</td><td><button class="row-action" data-detail="${row[0]}">查看详情 →</button></td></tr>`).join('')}</tbody></table></div></section>`,
    },
    resources:{title:'运行资源',eyebrow:'资源治理',description:'查看镜像治理、运行时健康、资源配额与实例状态。',body:()=>`
      <div class="metrics"><div class="metric"><span class="metric-label">运行中实例</span><span class="metric-value">62</span><span class="metric-foot">当前占用 71%</span></div><div class="metric"><span class="metric-label">已治理镜像</span><span class="metric-value">18</span><span class="metric-foot">扫描状态已通过</span></div><div class="metric"><span class="metric-label">配额预警</span><span class="metric-value">04</span><span class="metric-foot"><span class="delta warn">2 项高风险</span></span></div><div class="metric"><span class="metric-label">活跃工作区会话</span><span class="metric-value">84</span><span class="metric-foot">最近 24 小时</span></div></div>
      <section class="section"><div class="tabs" role="tablist" aria-label="资源分类"><button class="active" role="tab" aria-selected="true" data-resource-tab="runtime">运行时与配额</button><button role="tab" aria-selected="false" data-resource-tab="images">镜像治理</button><button role="tab" aria-selected="false" data-resource-tab="instances">实例与会话</button></div><div id="resourcePanel"></div></section>`,
    },
    incidents:{title:'异常中心',eyebrow:'运行保障',description:'集中定位任务、扫描、预检与运行异常，并追踪补偿任务状态。',body:()=>`
      <div class="metrics"><div class="metric"><span class="metric-label">待处理异常</span><span class="metric-value">07</span><span class="metric-foot">跨任务与资源</span></div><div class="metric"><span class="metric-label">高优先级</span><span class="metric-value">02</span><span class="metric-foot"><span class="delta warn">建议立即排查</span></span></div><div class="metric"><span class="metric-label">待运行补偿</span><span class="metric-value">03</span><span class="metric-foot">操作前需复核影响</span></div><div class="metric"><span class="metric-label">今日已解决</span><span class="metric-value">14</span><span class="metric-foot"><span class="delta good">近 24 小时</span></span></div></div>
      <section class="panel section"><div class="toolbar"><input class="search" data-filter="incidentTable" placeholder="搜索对象 ID、Trace ID 或异常类型" aria-label="搜索异常"><select class="select" data-select-filter="incidentTable"><option value="all">全部状态</option><option value="待处理">待处理</option><option value="处理中">处理中</option><option value="待复核">待复核</option></select><select class="select"><option>最近 7 天</option><option>最近 24 小时</option><option>最近 30 天</option></select><span class="toolbar-end">异常详情按管理员权限显示</span></div><div class="table-wrap"><table id="incidentTable"><thead><tr><th>异常类型</th><th>关联对象</th><th>优先级</th><th>发生时间</th><th>状态</th><th>Trace ID</th><th></th></tr></thead><tbody>${incidentRows.map(row=>`<tr data-search="${row.join(' ').toLowerCase()}" data-priority="${row[4]}"><td class="object-cell">${row[0]}</td><td class="mono">${row[1]}</td><td>${priorityPill(row[2])}</td><td>${row[3]}</td><td>${statePill(row[4])}</td><td class="mono">${row[5]}</td><td><button class="row-action" data-detail="${row[0]}">排查 →</button></td></tr>`).join('')}</tbody></table></div></section>
      <section class="panel section"><div class="panel-head"><h2>补偿任务</h2><span class="pill amber">3 个待复核</span></div><div class="panel-body split"><div><div class="queue-title">实例回收失败</div><div class="queue-meta">资源回收 · comp_01M8F2 · 最近重试 10:26</div></div><div><div class="queue-title">报告扫描超时</div><div class="queue-meta">文件扫描 · comp_01M8D9 · 等待人工复核</div></div></div></section>`,
    },
    audit:{title:'操作审计',eyebrow:'安全与审计',description:'检索关键平台操作，核对操作者、变更对象、执行结果和关联 Trace。',body:()=>`
      <section class="panel"><div class="toolbar"><input class="search" data-filter="auditTable" placeholder="搜索操作者、操作、资源或 Trace ID" aria-label="搜索审计日志"><select class="select" data-select-filter="auditTable"><option value="all">全部结果</option><option value="成功">成功</option><option value="需复核">需复核</option><option value="失败">失败</option></select><select class="select"><option>最近 7 天</option><option>今天</option><option>最近 30 天</option></select><button class="btn" id="exportAudit">导出当前记录</button><span class="toolbar-end">仅展示有权限访问的审计数据</span></div><div class="table-wrap"><table id="auditTable"><thead><tr><th>时间</th><th>操作者</th><th>动作</th><th>对象</th><th>结果</th><th>Trace ID</th></tr></thead><tbody>${auditRows.map(row=>`<tr data-search="${row.join(' ').toLowerCase()}" data-priority="${row[4]}"><td>${row[0]}</td><td>${row[1]}</td><td class="object-cell">${row[2]}</td><td>${row[3]}</td><td>${statePill(row[4])}</td><td><button class="row-action mono" data-detail="Trace ${row[5]}">${row[5]}</button></td></tr>`).join('')}</tbody></table></div></section>
      <div class="section-title section"><h2>审计查询说明</h2><small>生产界面接入时以服务端权限和审计保留策略为准</small></div><div class="health-list"><div class="health"><div class="health-top">操作范围</div><p>筛选管理员、资源对象、操作结果和时间范围。</p></div><div class="health"><div class="health-top">Trace 关联</div><p>通过 Trace ID 关联请求与必要的运行记录。</p></div><div class="health"><div class="health-top">数据保护</div><p>不在界面或日志中展示密钥、Cookie 和完整文件内容。</p></div></div>`,
    }
  };
  const governanceRows=[['教师资格审核','用户与资格','高','2 天 4 小时','未分配'],['运行时容量告警','运行时与实例','高','5 小时','管理员 A'],['镜像扫描异常','镜像治理','中','19 小时','管理员 B'],['异常实验任务','安全与审计','中','8 小时','未分配'],['模板预检失败','模板治理','低','1 天','管理员 A'],['课程状态复核','课程治理','低','2 天','管理员 C']];
  const incidentRows=[['实验任务异常','task_01M8F2','中','今天 10:02','待处理','tr_7fd2a190'],['报告扫描超时','asset_01M8C7','低','今天 09:14','处理中','tr_1ac93e71'],['模板预检失败','template_01M7D1','中','昨天 18:40','待复核','tr_37be24c0']];
  const auditRows=[['今天 14:32','管理员 A','更新运行时资源配置','集群 B','成功','tr_2de891a4'],['今天 13:55','周老师','发布模板版本 v1.3','Linux 网络故障排查','成功','tr_79b382cd'],['今天 12:18','系统','停止异常实验实例','task_01M8F2','需复核','tr_37be24c0'],['昨天 19:44','管理员 B','撤回镜像批准状态','Ubuntu Network Lab v2.2','成功','tr_e491f12b']];
  const queueItem=(title,meta,badge,tone,target)=>`<div class="queue-row"><div><div class="queue-title">${title}</div><div class="queue-meta">${meta}</div></div><button class="row-action" data-go="${target}"><span class="pill ${tone}">${badge}</span></button></div>`;
  const priorityPill=value=>`<span class="pill ${value==='高'?'red':value==='中'?'amber':'blue'}">${value}</span>`;
  const statePill=value=>`<span class="pill ${value==='成功'?'green':value==='待处理'||value==='失败'?'red':value==='处理中'?'blue':'amber'}">${value}</span>`;
  let currentPage='overview';
  function render(page){currentPage=pages[page]?page:'overview';const item=pages[currentPage];document.querySelector('#crumb').textContent=item.title;document.querySelector('#content').innerHTML=`<div class="page-head"><div><div class="eyebrow">${item.eyebrow}<span class="crumb-sep">/</span>平台管理</div><h1>${item.title}</h1><p>${item.description}</p></div><div class="head-actions"><span class="demo-tag">界面演示</span>${currentPage==='overview'?'<button class="btn" data-go="audit">查看审计记录 →</button>':''}</div></div>${item.body()}`;document.querySelectorAll('.nav button').forEach(button=>button.classList.toggle('active',button.dataset.page===currentPage));if(currentPage==='resources')renderResourceTab('runtime');}
  function renderResourceTab(name){const panel=document.querySelector('#resourcePanel');if(!panel)return;document.querySelectorAll('[data-resource-tab]').forEach(button=>{const active=button.dataset.resourceTab===name;button.classList.toggle('active',active);button.setAttribute('aria-selected',String(active))});if(name==='runtime'){panel.innerHTML=`<div class="columns"><section class="panel"><div class="panel-head"><h2>运行时健康</h2><span class="pill green">2 正常 · 1 需关注</span></div><div class="panel-body">${[['Docker Sandbox · v3','健康率 99.8%','green'],['Notebook Runtime · v2','健康率 99.4%','green'],['Judge Worker · v1','队列占用 72%','amber']].map(([a,b,c])=>`<div class="resource-row"><div><div class="queue-title">${a}</div><div class="queue-meta">${b}</div></div>${statePill(c==='green'?'健康':'需关注')}</div>`).join('')}</div></section><section class="panel"><div class="panel-head"><h2>配额使用</h2><span class="muted">本学期</span></div><div class="panel-body">${[['CPU','71%','amber'],['内存','58%',''],['对象存储','43%','']].map(([a,b,c])=>`<div class="progress-row"><span>${a}</span><div class="track ${c}"><span style="--w:${b}"></span></div><strong>${b}</strong></div>`).join('')}</div></section></div><section class="panel section"><div class="panel-head"><h2>资源规格</h2><span class="pill gray">状态及操作由服务端权限决定</span></div><div class="table-wrap"><table><thead><tr><th>规格</th><th>CPU</th><th>内存</th><th>当前使用</th><th>状态</th><th></th></tr></thead><tbody><tr><td class="object-cell">small</td><td>1 vCPU</td><td>2 GB</td><td>34 / 60</td><td>${statePill('启用')}</td><td><button class="row-action" data-detail="资源规格 small">查看 →</button></td></tr><tr><td class="object-cell">medium</td><td>2 vCPU</td><td>4 GB</td><td>22 / 40</td><td>${statePill('启用')}</td><td><button class="row-action" data-detail="资源规格 medium">查看 →</button></td></tr></tbody></table></div></section>`}else{const rows=name==='images'?[['Ubuntu Network Lab','v2.4 · sha256:8f2c…b91','扫描通过','已批准','今天 14:22'],['Python Data Science','v1.8 · sha256:51ad…90e','等待复核','待审核','今天 11:05'],['Docker Sandbox','v3 · sha256:11ce…82a','扫描失败','已阻止','昨天 16:38']]:[['ws_01M8F2','task_01M8F2','运行中','medium · 2 vCPU','今天 14:32'],['ws_01M7C9','task_01M7C9','空闲','small · 1 vCPU','今天 13:54'],['ws_01M6B4','task_01M6B4','回收失败','large · 4 vCPU','昨天 22:18']];panel.innerHTML=`<section class="panel"><div class="toolbar"><input class="search" data-filter="resourceTable" placeholder="搜索资源名称或对象 ID" aria-label="搜索资源"><span class="toolbar-end">数据仅用于界面演示</span></div><div class="table-wrap"><table id="resourceTable"><thead><tr>${(name==='images'?['镜像','版本 / Digest','扫描状态','治理状态','最近检查','']:['实例','关联任务','运行状态','资源规格','最近活动','']).map(v=>`<th>${v}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr data-search="${row.join(' ').toLowerCase()}">${row.map((value,i)=>`<td class="${i===0?'object-cell':''}">${i===(name==='images'?2:2)?statePill(value):value}</td>`).join('')}<td><button class="row-action" data-detail="${row[0]}">查看 →</button></td></tr>`).join('')}</tbody></table></div></section>`}}
  function openDetail(title){document.querySelector('#drawerTitle').textContent=title;document.querySelector('#drawerSubtitle').textContent='治理记录 · 演示数据';document.querySelector('#drawerBody').innerHTML=`<div class="drawer-section"><h3>对象信息</h3><div class="detail-line"><span>当前状态</span><strong>待人工核查</strong></div><div class="detail-line"><span>创建时间</span><strong>2026-10-15 10:02</strong></div><div class="detail-line"><span>关联 Trace ID</span><strong class="mono">tr_37be24c0</strong></div></div><div class="drawer-section"><h3>处理建议</h3><div style="font-size:11px;line-height:1.7;color:var(--muted)">先检查关联资源状态和服务端返回的允许操作，再决定是否分派、复核或发起补偿。此原型不执行真实平台操作。</div></div><div class="drawer-actions"><button class="btn" id="drawerDismiss">关闭</button><button class="btn primary" id="drawerSimulate">了解详情</button></div>`;document.querySelector('#drawerBackdrop').classList.add('open');document.querySelector('#drawerDismiss').onclick=closeDrawer;document.querySelector('#drawerSimulate').onclick=()=>{closeDrawer();showToast('当前为 UI 演示，未执行平台操作')}}
  function closeDrawer(){document.querySelector('#drawerBackdrop').classList.remove('open')}
  function showToast(message){const toast=document.querySelector('#toast');toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),2300)}
  function filterTable(tableId){const table=document.getElementById(tableId);if(!table)return;const query=(document.querySelector(`[data-filter="${tableId}"]`)?.value||'').trim().toLowerCase();const selected=document.querySelector(`[data-select-filter="${tableId}"]`)?.value||'all';table.querySelectorAll('tbody tr').forEach(row=>{const matchesText=(row.dataset.search||'').includes(query);const matchesFilter=selected==='all'||row.dataset.priority===selected;row.hidden=!(matchesText&&matchesFilter)})}
  document.addEventListener('click',event=>{const button=event.target.closest('[data-page],[data-go],[data-detail],[data-resource-tab]');if(!button)return;if(button.dataset.page||button.dataset.go){const page=button.dataset.page||button.dataset.go;render(page);if(innerWidth<=720)document.querySelector('.sidebar').style.display='none'}else if(button.dataset.detail){openDetail(button.dataset.detail)}else if(button.dataset.resourceTab){renderResourceTab(button.dataset.resourceTab)}});
  document.addEventListener('input',event=>{if(event.target.dataset.filter)filterTable(event.target.dataset.filter)});
  document.addEventListener('change',event=>{if(event.target.dataset.selectFilter)filterTable(event.target.dataset.selectFilter)});
  document.querySelector('#closeDrawer').addEventListener('click',closeDrawer);document.querySelector('#drawerBackdrop').addEventListener('click',event=>{if(event.target.id==='drawerBackdrop')closeDrawer()});document.querySelector('#helpButton').addEventListener('click',()=>showToast('管理端 UI 设计原型 · 交互为演示'));
  document.querySelector('#mobileMenu').addEventListener('click',()=>{const sidebar=document.querySelector('.sidebar');sidebar.style.display=sidebar.style.display==='flex'?'none':'flex';if(sidebar.style.display==='flex'){sidebar.style.position='fixed';sidebar.style.width='248px';sidebar.style.boxShadow='8px 0 28px #17281e22'}});
  document.querySelector('#exportAudit')?.addEventListener('click',()=>{const rows=[['时间','操作者','动作','对象','结果','Trace ID'],...auditRows];const csv='\ufeff'+rows.map(row=>row.map(cell=>`"${cell.replaceAll('"','""')}"`).join(',')).join('\r\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.download='audit-demo.csv';link.click();URL.revokeObjectURL(link.href);showToast('已导出演示记录')});
  document.querySelector('#content').addEventListener('click',event=>{const button=event.target.closest('[data-go],[data-detail],[data-resource-tab]');if(button?.dataset.go||button?.dataset.detail||button?.dataset.resourceTab)return});
  render('overview');
</script>
</body>
</html>
