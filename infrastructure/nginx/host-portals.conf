# Include inside the HOST nginx http {} context, after replacing the old
# IP/portal-cookie server. Container nginx on 127.0.0.1:8080 stays unchanged.
# These temporary DNS names resolve to 121.43.117.116. Replace all three
# names together when moving to owned domains; keep session cookies host-only.
map $host $edu_portal_host {
    default "";
    student.121.43.117.116.sslip.io student.localhost;
    teacher.121.43.117.116.sslip.io teacher.localhost;
    admin.121.43.117.116.sslip.io admin.localhost;
}

map $http_upgrade $edu_portal_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name student.121.43.117.116.sslip.io
                teacher.121.43.117.116.sslip.io
                admin.121.43.117.116.sslip.io;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # Route only by hostname. Never use $cookie_portal or Referer here.
        proxy_set_header Host $edu_portal_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $edu_portal_connection;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

# Old bookmarks select a destination once; they no longer mutate a shared cookie.
server {
    listen 80;
    server_name 121.43.117.116;

    location = /__portal/student {
        return 302 http://student.121.43.117.116.sslip.io/$is_args$args;
    }
    location = /__portal/teacher {
        return 302 http://teacher.121.43.117.116.sslip.io/$is_args$args;
    }
    location = /__portal/admin {
        return 302 http://admin.121.43.117.116.sslip.io/$is_args$args;
    }
    location = / {
        return 302 http://student.121.43.117.116.sslip.io/;
    }
    # Never authenticate or choose a default portal on the shared IP origin.
    location / { return 410; }
}
