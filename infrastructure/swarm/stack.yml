version: "3.9"

x-app-environment: &app-environment
  APP_ENV: integration
  APP_VERSION: ${APP_VERSION:-0.15.0-p15}
  OPENAPI_REVISION: ${OPENAPI_REVISION:-v2-p15}
  DJANGO_SETTINGS_MODULE: education_experiment_platform.settings.prod
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
  DJANGO_TRUSTED_ORIGINS: ${DJANGO_TRUSTED_ORIGINS}
  WORKSPACE_ALLOWED_ORIGINS: ${WORKSPACE_ALLOWED_ORIGINS}
  USER_HOST: ${USER_HOST}
  TEACHER_HOST: ${TEACHER_HOST}
  ADMIN_HOST: ${ADMIN_HOST}
  API_HOST: ${API_HOST}
  WORKSPACE_COOKIE_NAME: workspace_ticket
  WORKSPACE_AUTHORITY_URL: http://django:8000
  SWARM_DOCKER_HOST: ${SWARM_DOCKER_HOST}
  SWARM_DOCKER_TLS_VERIFY: "true"
  SWARM_DOCKER_CA_PATH: /run/secrets/swarm_docker_ca
  SWARM_DOCKER_CERT_PATH: /run/secrets/swarm_docker_cert
  SWARM_DOCKER_KEY_PATH: /run/secrets/swarm_docker_key
  SWARM_RUNTIME_NETWORK: ${SWARM_RUNTIME_NETWORK:-edu-runtime}
  LOCAL_RUNTIME_IMAGE: ${LOCAL_RUNTIME_IMAGE:-edu-platform-algorithm-workspace:local}
  LOCAL_RUNTIME_NETWORK: ${LOCAL_RUNTIME_NETWORK:-edu-runtime}
  LOCAL_DOCKER_HOST: ${LOCAL_DOCKER_HOST:-unix:///var/run/docker.sock}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS}
  MYSQL_DATABASE: edu_platform
  MYSQL_USER: edu_platform_app
  MYSQL_HOST: ${MYSQL_HOST}
  MYSQL_PORT: "3306"
  REDIS_URL: ${REDIS_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  MINIO_INTERNAL_ENDPOINT: ${MINIO_ENDPOINT}
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
  MINIO_APP_ACCESS_KEY_FILE: /run/secrets/minio_app_access_key
  MINIO_APP_SECRET_KEY_FILE: /run/secrets/minio_app_secret_key
  MINIO_BUCKET: edu-platform
  CLAMAV_HOST: ${CLAMAV_HOST}
  CLAMAV_PORT: "3310"
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  COURSE_INVITATION_HMAC_KEY_FILE: /run/secrets/course_invitation_hmac_key

x-fluentd-logging: &fluentd-logging
  driver: fluentd
  options:
    fluentd-address: localhost:24224
    fluentd-async: "true"
    tag: "edu.{{.Name}}"

services:
  nginx:
    image: ${REGISTRY}/edu-platform-nginx:${IMAGE_TAG}
    ports:
      - target: 8080
        published: 80
        mode: ingress
      - target: 8443
        published: 443
        mode: ingress
    secrets: [tls_certificate, tls_private_key]
    networks: [edge]
    logging: *fluentd-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null --header='Host: ${USER_HOST}' https://127.0.0.1:8443/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 2
      placement:
        constraints: [node.labels.edu.role.edge == true]
      resources:
        reservations: { cpus: "0.10", memory: 64M }
        limits: { cpus: "0.50", memory: 256M }
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }
      rollback_config: { parallelism: 1, order: stop-first }

  kong:
    image: ${KONG_IMAGE}
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /run/configs/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_ADMIN_LISTEN: "off"
    configs:
      - source: kong_config_v1
        target: /run/configs/kong.yml
    networks: [edge, app]
    logging: *fluentd-logging
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 2
      placement:
        constraints: [node.labels.edu.role.edge == true]
      resources:
        reservations: { cpus: "0.25", memory: 256M }
        limits: { cpus: "1.00", memory: 768M }
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }
      rollback_config: { parallelism: 1, order: stop-first }

  django:
    image: ${REGISTRY}/edu-platform-backend:${IMAGE_TAG}
    environment:
      <<: *app-environment
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      IDENTITY_HMAC_KEY_FILE: /run/secrets/identity_hmac_key
      COURSE_INVITATION_HMAC_KEY_FILE: /run/secrets/course_invitation_hmac_key
      WORKSPACE_INTERNAL_KEY_FILE: /run/secrets/workspace_internal_key
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
    secrets: [django_secret_key, identity_hmac_key, course_invitation_hmac_key, workspace_internal_key, mysql_app_password, minio_app_access_key, minio_app_secret_key]
    networks: [app, data]
    logging: *fluentd-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "X-Forwarded-Proto: https", "http://127.0.0.1:8000/api/v2/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 3
      placement:
        constraints: [node.labels.edu.role.app == true]
      resources:
        reservations: { cpus: "0.25", memory: 256M }
        limits: { cpus: "1.00", memory: 768M }
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }
      rollback_config: { parallelism: 1, order: stop-first }

  celery:
    image: ${REGISTRY}/edu-platform-backend:${IMAGE_TAG}
    command: ["celery", "-A", "education_experiment_platform", "worker", "--loglevel=INFO", "--queues=q_default,q_relay,q_agent,q_content,q_analytics,q_integrations"]
    environment:
      <<: *app-environment
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      IDENTITY_HMAC_KEY_FILE: /run/secrets/identity_hmac_key
      COURSE_INVITATION_HMAC_KEY_FILE: /run/secrets/course_invitation_hmac_key
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
    secrets: [django_secret_key, identity_hmac_key, course_invitation_hmac_key, mysql_app_password, minio_app_access_key, minio_app_secret_key]
    networks: [app, data]
    logging: *fluentd-logging
    deploy:
      replicas: 2
      placement:
        constraints: [node.labels.edu.role.worker == true]
      resources:
        reservations: { cpus: "0.25", memory: 256M }
        limits: { cpus: "1.00", memory: 768M }
      update_config: { parallelism: 1, order: stop-first, failure_action: rollback }

  runtime-worker:
    image: ${REGISTRY}/edu-platform-backend:${IMAGE_TAG}
    command: ["celery", "-A", "education_experiment_platform", "worker", "--loglevel=INFO", "--concurrency=${RUNTIME_WORKER_CONCURRENCY:-2}", "--queues=q_provision,q_archive,q_compensate"]
    environment:
      <<: *app-environment
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      IDENTITY_HMAC_KEY_FILE: /run/secrets/identity_hmac_key
      COURSE_INVITATION_HMAC_KEY_FILE: /run/secrets/course_invitation_hmac_key
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
    secrets: [django_secret_key, identity_hmac_key, course_invitation_hmac_key, mysql_app_password, minio_app_access_key, minio_app_secret_key, swarm_docker_ca, swarm_docker_cert, swarm_docker_key]
    networks: [app, data, runtime]
    deploy:
      replicas: 2
      placement:
        constraints: [node.labels.edu.role.runtime == true]
      resources:
        reservations: { cpus: "0.25", memory: 256M }
        limits: { cpus: "1.00", memory: 768M }
      update_config: { parallelism: 1, order: stop-first, failure_action: rollback }

  workspace-gateway:
    image: ${REGISTRY}/edu-platform-backend:${IMAGE_TAG}
    command: ["uvicorn", "education_experiment_platform.workspace_gateway:application", "--host", "0.0.0.0", "--port", "8080", "--no-proxy-headers"]
    environment:
      <<: *app-environment
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      IDENTITY_HMAC_KEY_FILE: /run/secrets/identity_hmac_key
      COURSE_INVITATION_HMAC_KEY_FILE: /run/secrets/course_invitation_hmac_key
      WORKSPACE_INTERNAL_KEY_FILE: /run/secrets/workspace_internal_key
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
    secrets: [django_secret_key, identity_hmac_key, course_invitation_hmac_key, workspace_internal_key, mysql_app_password]
    networks: [app, runtime]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 2
      placement:
        constraints: [node.labels.edu.role.app == true]
      resources:
        reservations: { cpus: "0.10", memory: 128M }
        limits: { cpus: "0.50", memory: 384M }
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }

  runtime-reference:
    image: ${REGISTRY}/edu-platform-reference-workspace:${IMAGE_TAG}
    networks: [runtime]
    deploy:
      replicas: 0
      placement:
        constraints: [node.labels.edu.role.runtime == true]

  fluent-bit:
    image: ${FLUENT_BIT_IMAGE}
    configs:
      - source: fluent_bit_config_v1
        target: /fluent-bit/etc/fluent-bit.conf
      - source: fluent_bit_redact_v1
        target: /fluent-bit/etc/redact.lua
    volumes:
      - fluent-bit-buffer:/buffers
    networks: [observability]
    ports:
      - target: 24224
        published: 24224
        protocol: tcp
        mode: host
    deploy:
      mode: global
      resources:
        limits: { memory: 256M }

  log-ingest:
    image: ${REGISTRY}/edu-platform-backend:${IMAGE_TAG}
    command: ["python", "-m", "education_experiment_platform.log_ingest"]
    environment:
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      MONGODB_LOG_DATABASE: observability
      MONGODB_LOG_COLLECTION: runtime_logs
      MONGODB_LOG_TTL_DAYS: ${MONGODB_LOG_TTL_DAYS:-30}
    secrets: [mongodb_uri]
    networks: [observability, data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 2
      placement:
        constraints: [node.labels.edu.role.data == true]
      resources:
        limits: { memory: 256M }
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE}
    command: ["--config=/run/configs/otel.yml"]
    configs:
      - source: otel_config_v1
        target: /run/configs/otel.yml
    networks: [app, observability]
    deploy:
      mode: global
      resources:
        limits: { memory: 384M }

networks:
  edge: { driver: overlay }
  app:
    driver: overlay
    internal: true
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET}
  data: { driver: overlay, internal: true }
  runtime: { driver: overlay, internal: true, attachable: false }
  observability: { driver: overlay, internal: true }

volumes:
  fluent-bit-buffer: {}

configs:
  kong_config_v1:
    external: true
  fluent_bit_config_v1:
    external: true
  fluent_bit_redact_v1:
    external: true
  otel_config_v1:
    external: true

secrets:
  django_secret_key:
    external: true
  identity_hmac_key:
    external: true
  course_invitation_hmac_key:
    external: true
  mysql_app_password:
    external: true
  mongodb_uri:
    external: true
  minio_app_access_key:
    external: true
  minio_app_secret_key:
    external: true
  workspace_internal_key:
    external: true
  swarm_docker_ca:
    external: true
  swarm_docker_cert:
    external: true
  swarm_docker_key:
    external: true
  tls_certificate:
    external: true
  tls_private_key:
    external: true
