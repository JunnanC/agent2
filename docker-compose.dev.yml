name: experimental-platform

x-app-environment: &app-environment
  APP_ENV: local
  APP_VERSION: ${APP_VERSION:-0.15.0-p15}
  OPENAPI_REVISION: ${OPENAPI_REVISION:-v2-p15}
  SIMILARITY_ALGORITHM_VERSION: ${SIMILARITY_ALGORITHM_VERSION:-char-5gram-jaccard-v1}
  SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.30}
  SIMILARITY_RETENTION_DAYS: ${SIMILARITY_RETENTION_DAYS:-180}
  AUTO_CHECK_MAX_ATTEMPTS: ${AUTO_CHECK_MAX_ATTEMPTS:-${P10_AUTO_CHECK_MAX_ATTEMPTS:-3}}
  RUBRIC_AI_MODEL_NAME: ${RUBRIC_AI_MODEL_NAME:-}
  RUBRIC_AI_BASE_URL: ${RUBRIC_AI_BASE_URL:-}
  RUBRIC_AI_API_KEY: ${RUBRIC_AI_API_KEY:-}
  RUBRIC_AI_TIMEOUT_SECONDS: ${RUBRIC_AI_TIMEOUT_SECONDS:-60}
  CHAPTER_AI_MODEL_NAME: ${CHAPTER_AI_MODEL_NAME:-}
  CHAPTER_AI_BASE_URL: ${CHAPTER_AI_BASE_URL:-}
  CHAPTER_AI_API_KEY: ${CHAPTER_AI_API_KEY:-}
  ARCHIVE_RETENTION_DAYS: ${ARCHIVE_RETENTION_DAYS:-365}
  ARCHIVE_SAFE_RECYCLE_SECONDS: ${ARCHIVE_SAFE_RECYCLE_SECONDS:-900}
  ARCHIVE_EXPORT_TTL_SECONDS: ${ARCHIVE_EXPORT_TTL_SECONDS:-300}
  ARCHIVE_MAX_ATTEMPTS: ${ARCHIVE_MAX_ATTEMPTS:-5}
  RUNTIME_EXECUTION_RETENTION_DAYS: ${RUNTIME_EXECUTION_RETENTION_DAYS:-30}
  RUNTIME_CLEANUP_MAX_ATTEMPTS: ${RUNTIME_CLEANUP_MAX_ATTEMPTS:-10}
  GIT_REVISION: ${GIT_REVISION:-development}
  BUILD_TIME: ${BUILD_TIME:-development}
  DJANGO_SETTINGS_MODULE: education_experiment_platform.settings.integration
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-compose-key-change-me}
  IDENTITY_HMAC_KEY: ${IDENTITY_HMAC_KEY:-unsafe-local-identity-hmac-key-change-me}
  COURSE_INVITATION_HMAC_KEY: ${COURSE_INVITATION_HMAC_KEY:-unsafe-local-course-invitation-hmac-key-change-me}
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,django,student.localhost,teacher.localhost,admin.localhost,api.localhost,student.example.edu,teacher.example.edu,admin.example.edu,api.example.edu
  DJANGO_TRUSTED_ORIGINS: http://student.localhost:${ENTRY_PORT:-8080},http://teacher.localhost:${ENTRY_PORT:-8080},http://admin.localhost:${ENTRY_PORT:-8080}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@example.edu}
  STUDENT_PUBLIC_URL: ${STUDENT_PUBLIC_URL:-http://student.localhost:8080}
  TEACHER_PUBLIC_URL: ${TEACHER_PUBLIC_URL:-http://teacher.localhost:8080}
  TRUSTED_PROXY_CIDRS: ${APP_NETWORK_SUBNET:-172.29.20.0/24}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-edu_platform}
  MYSQL_USER: ${MYSQL_APP_USER:-edu_platform_app}
  MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-local-app-password}
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-runtime_logger}:${MONGO_INITDB_ROOT_PASSWORD:-local-mongo-password}@mongodb:27017/observability?authSource=admin&replicaSet=rs0
  MONGODB_LOG_DATABASE: observability
  MONGODB_LOG_COLLECTION: runtime_logs
  MONGODB_LOG_TTL_DAYS: ${MONGODB_LOG_TTL_DAYS:-30}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_INTERNAL_ENDPOINT: http://minio:9000
  MINIO_PUBLIC_ENDPOINT: http://127.0.0.1:${MINIO_API_PORT:-9000}
  MINIO_BUCKET: ${MINIO_BUCKET:-edu-platform}
  MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-edu-platform-app}
  MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-local-minio-app-password}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  LOG_LEVEL: INFO
  SWARM_DOCKER_HOST: ${SWARM_DOCKER_HOST:-unix:///var/run/docker.sock}
  SWARM_RUNTIME_NETWORK: ${SWARM_RUNTIME_NETWORK:-experimental-platform-swarm-runtime}
  RUNTIME_MODE: ${RUNTIME_MODE:-local}
  RUNTIME_ADAPTER_CODE: ${RUNTIME_ADAPTER_CODE:-runtime/local-docker}
  LOCAL_RUNTIME_IMAGE: ${LOCAL_RUNTIME_IMAGE:-experimental-platform-stdio:local}
  LOCAL_RUNTIME_NETWORK: ${LOCAL_RUNTIME_NETWORK:-${COMPOSE_PROJECT_NAME}-runtime}
  LOCAL_DOCKER_HOST: ${LOCAL_DOCKER_HOST:-unix:///var/run/docker.sock}
  LOCAL_RUNTIME_MODE: ${LOCAL_RUNTIME_MODE:-REAL}
  RUNTIME_ADAPTER_CONFIGS: '${RUNTIME_ADAPTER_CONFIGS:-{"runtime/local-docker":{"pids_limit":256}}}'

x-backend-build: &backend-build
  context: backend
  args:
    PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-public.ecr.aws/docker/library/python:3.14-slim}
    DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com/debian}
    DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}

x-fluentd-logging: &fluentd-logging
  driver: fluentd
  options:
    fluentd-address: localhost:${FLUENTD_HOST_PORT:-24224}
    fluentd-async: "true"
    tag: "edu.{{.Name}}"

services:
  mysql:
    container_name: ${COMPOSE_PROJECT_NAME}-mysql
    image: ${MYSQL_IMAGE:-public.ecr.aws/docker/library/mysql:8.4}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--binlog-format=ROW"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-edu_platform}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER:-edu_platform_migration}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:-local-migration-password}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-edu_platform_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:-local-app-password}
    volumes: [mysql-data:/var/lib/mysql]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        reservations: { memory: 512M }
        limits: { memory: 1G }

  mysql-users:
    container_name: ${COMPOSE_PROJECT_NAME}-mysql-users
    image: ${MYSQL_IMAGE:-public.ecr.aws/docker/library/mysql:8.4}
    command: ["bash", "/scripts/configure-users.sh", "prepare"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-edu_platform}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER:-edu_platform_migration}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:-local-migration-password}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-edu_platform_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:-local-app-password}
    volumes:
      - ./infrastructure/mysql/configure-users.sh:/scripts/configure-users.sh:ro
    # The mysql image declares VOLUME /var/lib/mysql; back it with tmpfs so a
    # one-shot helper never creates an anonymous volume.
    tmpfs: [/var/lib/mysql]
    networks: [data]
    depends_on:
      mysql: { condition: service_healthy }
    restart: "no"

  redis:
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        reservations: { memory: 128M }
        limits: { memory: 512M }

  mongo-keyfile:
    container_name: ${COMPOSE_PROJECT_NAME}-mongo-keyfile
    image: mongo:8.0
    user: root
    environment:
      MONGO_REPLICA_SET_KEY: ${MONGO_REPLICA_SET_KEY:-local-replica-set-key-change-this-value-now}
    command: ["bash", "-ec", "printf '%s' \"$$MONGO_REPLICA_SET_KEY\" > /keyfile/keyfile && chmod 400 /keyfile/keyfile && chown 999:999 /keyfile/keyfile"]
    volumes: [mongo-keyfile:/keyfile]
    # The mongo image declares VOLUME /data/db and /data/configdb; back them
    # with tmpfs so this one-shot helper never creates anonymous volumes.
    tmpfs: [/data/db, /data/configdb]
    restart: "no"

  mongodb:
    container_name: ${COMPOSE_PROJECT_NAME}-mongodb
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/keyfile/keyfile", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-runtime_logger}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-local-mongo-password}
    volumes:
      - mongo-data:/data/db
      - mongo-keyfile:/keyfile:ro
    # /data/configdb comes from the image VOLUME declaration; tmpfs keeps it
    # from creating an anonymous volume.
    tmpfs: [/data/configdb]
    networks: [data]
    depends_on:
      mongo-keyfile: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        reservations: { memory: 256M }
        limits: { memory: 768M }

  mongo-init:
    container_name: ${COMPOSE_PROJECT_NAME}-mongo-init
    image: mongo:8.0
    environment:
      MONGO_USER: ${MONGO_INITDB_ROOT_USERNAME:-runtime_logger}
      MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-local-mongo-password}
    command:
      - bash
      - -ec
      - |
        mongosh --host mongodb:27017 --username "$$MONGO_USER" --password "$$MONGO_PASSWORD" --authenticationDatabase admin --eval '
          try { rs.status() } catch (error) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}) }
        '
    networks: [data]
    # The mongo image declares VOLUME /data/db and /data/configdb; back them
    # with tmpfs so this one-shot init never creates anonymous volumes.
    tmpfs: [/data/db, /data/configdb]
    depends_on:
      mongodb: { condition: service_healthy }
    restart: "no"

  minio:
    container_name: ${COMPOSE_PROJECT_NAME}-minio
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:latest}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-edu-platform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
    volumes: [minio-data:/data]
    # The bitnami image declares VOLUME /bitnami/minio/data and /certs; tmpfs
    # keeps them from becoming anonymous volumes.
    tmpfs: ["/bitnami/minio/data:uid=1001,gid=1001", "/certs:uid=1001,gid=1001"]
    networks: [data, minio-host-access]
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        reservations: { memory: 256M }
        limits: { memory: 768M }

  minio-init:
    container_name: ${COMPOSE_PROJECT_NAME}-minio-init
    image: ${MINIO_CLIENT_IMAGE:-bitnamilegacy/minio-client:latest}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-edu-platform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-edu-platform}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-edu-platform-app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-local-minio-app-password}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc version enable "local/$$MINIO_BUCKET"
        mc admin user add local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY" || true
        mc admin policy create local edu-platform-app /policies/app-policy.json || true
        mc admin policy attach local edu-platform-app --user "$$MINIO_APP_ACCESS_KEY" || true
    volumes:
      - ./infrastructure/minio/app-policy.json:/policies/app-policy.json:ro
    networks: [data]
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"

  clamav:
    container_name: ${COMPOSE_PROJECT_NAME}-clamav
    image: clamav/clamav:1.4
    volumes: [clamav-data:/var/lib/clamav]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc 127.0.0.1 3310 | grep PONG"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    deploy:
      resources:
        reservations: { memory: 768M }
        limits: { memory: 2G }

  migrate:
    container_name: ${COMPOSE_PROJECT_NAME}-migrate
    image: experimental-platform-backend:local
    build: *backend-build
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      <<: *app-environment
      MYSQL_USER: ${MYSQL_MIGRATION_USER:-edu_platform_migration}
      MYSQL_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:-local-migration-password}
    networks: [data]
    depends_on:
      mysql-users: { condition: service_completed_successfully }
    restart: "no"

  mysql-grants:
    container_name: ${COMPOSE_PROJECT_NAME}-mysql-grants
    image: ${MYSQL_IMAGE:-public.ecr.aws/docker/library/mysql:8.4}
    command: ["bash", "/scripts/configure-users.sh", "restrict"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-edu_platform}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER:-edu_platform_migration}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:-local-migration-password}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-edu_platform_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:-local-app-password}
    volumes:
      - ./infrastructure/mysql/configure-users.sh:/scripts/configure-users.sh:ro
    # The mysql image declares VOLUME /var/lib/mysql; back it with tmpfs so a
    # one-shot helper never creates an anonymous volume.
    tmpfs: [/var/lib/mysql]
    networks: [data]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  core-check:
    container_name: ${COMPOSE_PROJECT_NAME}-core-check
    image: experimental-platform-backend:local
    profiles: ["tools"]
    build: *backend-build
    environment: *app-environment
    networks: [data]

  django:
    container_name: ${COMPOSE_PROJECT_NAME}-django
    image: experimental-platform-backend:local
    build: *backend-build
    environment:
      <<: *app-environment
      PROJECT_ROOT: /workspace
    volumes:
      - .:/workspace:ro
    networks: [app, data]
    depends_on:
      mysql-grants: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      fluent-bit: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v2/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *fluentd-logging
    deploy:
      replicas: 1
      resources:
        reservations: { cpus: "0.25", memory: 256M }
        limits: { cpus: "1.00", memory: 768M }
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }

  celery:
    container_name: ${COMPOSE_PROJECT_NAME}-celery
    image: experimental-platform-backend:local
    build: *backend-build
    command: ["celery", "-A", "education_experiment_platform", "worker", "--loglevel=INFO", "--concurrency=${CELERY_CONCURRENCY:-4}", "--queues=q_default,q_relay,q_agent,q_content,q_analytics,q_integrations"]
    environment: *app-environment
    networks: [app, data, default]
    depends_on:
      mysql-grants: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      fluent-bit: { condition: service_started }
    logging: *fluentd-logging
    deploy:
      resources:
        reservations: { cpus: "0.25", memory: 256M }
        limits: { cpus: "1.00", memory: 768M }
      update_config: { parallelism: 1, order: stop-first, failure_action: rollback }

  runtime-worker:
    container_name: ${COMPOSE_PROJECT_NAME}-runtime-worker
    image: experimental-platform-backend:local
    profiles: ["runtime"]
    build: *backend-build
    command: ["celery", "-A", "education_experiment_platform", "worker", "--loglevel=INFO", "--concurrency=${RUNTIME_WORKER_CONCURRENCY:-2}", "--queues=q_provision,q_archive,q_compensate"]
    environment: *app-environment
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    networks: [app, data, runtime]
    depends_on:
      mysql-grants: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    logging: *fluentd-logging
    deploy:
      resources:
        reservations: { cpus: "0.25", memory: 256M }
        limits: { cpus: "1.00", memory: 768M }
      update_config: { parallelism: 1, order: stop-first, failure_action: rollback }

  runtime-stdio:
    profiles: ["tools"]
    platform: linux/amd64
    build:
      context: ./runtime/algorithm-workspace
      dockerfile: Dockerfile.stdio
      args:
        STDIO_BASE_REGISTRY: public.ecr.aws/docker/library
    image: experimental-platform-stdio:local
    entrypoint: ["python", "--version"]
    network_mode: none
    read_only: true

  celery-beat:
    container_name: ${COMPOSE_PROJECT_NAME}-celery-beat
    image: experimental-platform-backend:local
    build: *backend-build
    command: ["celery", "-A", "education_experiment_platform", "beat", "--loglevel=INFO"]
    environment: *app-environment
    networks: [app, data]
    depends_on:
      mysql-grants: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      fluent-bit: { condition: service_started }
    logging: *fluentd-logging
    deploy:
      resources:
        reservations: { cpus: "0.10", memory: 128M }
        limits: { cpus: "0.50", memory: 384M }
      update_config: { parallelism: 1, order: stop-first, failure_action: rollback }

  log-ingest:
    container_name: ${COMPOSE_PROJECT_NAME}-log-ingest
    image: experimental-platform-backend:local
    build: *backend-build
    command: ["python", "-m", "education_experiment_platform.log_ingest"]
    environment: *app-environment
    networks: [observability, data]
    depends_on:
      mongo-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 256M }

  fluent-bit:
    container_name: ${COMPOSE_PROJECT_NAME}-fluent-bit
    image: cr.fluentbit.io/fluent/fluent-bit:4.0.9
    volumes:
      - ./infrastructure/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./infrastructure/fluent-bit/redact.lua:/fluent-bit/etc/redact.lua:ro
      - fluent-bit-buffer:/buffers
    networks: [observability, log-driver]
    ports: ["127.0.0.1:${FLUENTD_HOST_PORT:-24224}:24224"]
    depends_on:
      log-ingest: { condition: service_healthy }
    deploy:
      mode: global
      resources:
        limits: { memory: 256M }

  otel-collector:
    container_name: ${COMPOSE_PROJECT_NAME}-otel-collector
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes: [./infrastructure/otel/collector.yml:/etc/otelcol/config.yml:ro]
    networks: [app, observability]
    deploy:
      mode: global
      resources:
        limits: { memory: 384M }

  prometheus:
    container_name: ${COMPOSE_PROJECT_NAME}-prometheus
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [app, observability]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    deploy:
      resources:
        limits: { memory: 512M }

  kong:
    container_name: ${COMPOSE_PROJECT_NAME}-kong
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_NGINX_WORKER_PROCESSES: "2"
      KONG_LOG_LEVEL: ${KONG_LOG_LEVEL:-notice}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: "off"
    volumes: [./infrastructure/kong/kong.yml:/kong/declarative/kong.yml:ro]
    networks: [edge, app]
    depends_on:
      django: { condition: service_healthy }
      fluent-bit: { condition: service_started }
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *fluentd-logging
    deploy:
      replicas: 1
      resources:
        reservations: { cpus: "0.25", memory: 256M }
        limits: { cpus: "1.00", memory: 768M }
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }

  nginx:
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    image: experimental-platform-web:local
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-public.ecr.aws/docker/library/node:24-alpine}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:1.29-alpine}
        APP_VERSION: ${APP_VERSION:-0.15.0-p15}
        OPENAPI_REVISION: ${OPENAPI_REVISION:-v2-p15}
        GIT_REVISION: ${GIT_REVISION:-development}
        BUILD_TIME: ${BUILD_TIME:-development}
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    networks: [edge]
    ports: ["${ENTRY_PORT:-8080}:8080"]
    depends_on:
      kong: { condition: service_healthy }
      fluent-bit: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health", "--header=Host: student.localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *fluentd-logging
    deploy:
      replicas: 1
      resources:
        reservations: { cpus: "0.10", memory: 64M }
        limits: { cpus: "0.50", memory: 256M }
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}-default
  edge:
    name: ${COMPOSE_PROJECT_NAME}-edge
  minio-host-access:
    name: ${COMPOSE_PROJECT_NAME}-minio-host-access
  app:
    name: ${COMPOSE_PROJECT_NAME}-app
    internal: true
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:-172.29.20.0/24}
  runtime:
    name: ${COMPOSE_PROJECT_NAME}-runtime
    internal: true
  data:
    name: ${COMPOSE_PROJECT_NAME}-data
    internal: true
  observability:
    name: ${COMPOSE_PROJECT_NAME}-observability
    internal: true
  log-driver:
    name: ${COMPOSE_PROJECT_NAME}-log-driver

volumes:
  mysql-data:
    name: ${COMPOSE_PROJECT_NAME}-mysql-data
  redis-data:
    name: ${COMPOSE_PROJECT_NAME}-redis-data
  mongo-data:
    name: ${COMPOSE_PROJECT_NAME}-mongo-data
  mongo-keyfile:
    name: ${COMPOSE_PROJECT_NAME}-mongo-keyfile
  minio-data:
    name: ${COMPOSE_PROJECT_NAME}-minio-data
  clamav-data:
    name: ${COMPOSE_PROJECT_NAME}-clamav-data
  fluent-bit-buffer:
    name: ${COMPOSE_PROJECT_NAME}-fluent-bit-buffer
  prometheus-data:
    name: ${COMPOSE_PROJECT_NAME}-prometheus-data
